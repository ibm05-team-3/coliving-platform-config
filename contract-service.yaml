# contract-service 공통 설정
spring:
  application:
    name: contract-service
  grpc:
    client:
      channel:
        room:                      # GrpcClientConfig의 @ImportGrpcClients(target = "room")과 같은 이름
          # 매물 서비스 gRPC 서버 주소 (gRPC 포트 = 9000 + HTTP 포트 끝자리, property-service는 9083)
          # 로컬: localhost:9083 / 쿠버네티스: dns:///매물서비스이름:9083 → 환경변수로 덮어쓰기
          # (Feign과 달리 Eureka 서비스 이름으로는 주소를 찾지 않는다)
          target: ${ROOM_GRPC_TARGET:localhost:9083}
          default:
            deadline: 3s           # 응답 제한 시간. 넘기면 DEADLINE_EXCEEDED → 503
        document:
          target: ${DOCUMENT_GRPC_TARGET:localhost:9087}    # 문서 서비스 — 계약서 양식 조회. target은 환경별 파일에서
          default:
            deadline: 3s
        user:
          target: ${USER_GRPC_TARGET:localhost:9082}
          default:
            deadline: 3s
        

auth:
  access-token-key-id: es256-demo        # user-service와 동일해야 검증 가능
  access-token-issuer: user-service      # 발급자는 user-service

app:
  kafka:
    topics:
      status-changed: contract.status-changed     # dashboard
      payment-completed: payment.completed        # dashboard (기존 contract.payment.completed는 안 맞음)
      contract-completed: contract.completed      # community
 