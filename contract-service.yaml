# contract-service 공통 설정
spring:
  application:
    name: contract-service
  grpc:
    client:
      channel:
        document:                  # GrpcClientConfig의 @ImportGrpcClients(target = "document")과 같은 이름
          # 문서 서비스 gRPC 서버 주소 — 계약서 양식 조회 (gRPC 포트 = 9000 + HTTP 포트 끝자리)
          # 로컬: localhost:9087 / 쿠버네티스: 환경변수 DOCUMENT_GRPC_TARGET으로 덮어쓰기
          # (Eureka 서비스 이름으로는 주소를 찾지 않는다)
          target: ${DOCUMENT_GRPC_TARGET:localhost:9087}
          default:
            deadline: 3s           # 응답 제한 시간. 넘기면 DEADLINE_EXCEEDED → 503
        

app:
  kafka:
    topics:
      status-changed: contract.status-changed     # dashboard
      payment-completed: payment.completed        # dashboard (기존 contract.payment.completed는 안 맞음)
      contract-completed: contract.completed      # community
 