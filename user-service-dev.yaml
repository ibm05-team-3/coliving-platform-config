# user-service 개발 환경 전용
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/user_service
    username: postgres
    password: admin
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    generate-ddl: true
    hibernate:
      ddl-auto: update
    show-sql: true

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:1}

  security:
    oauth2:
      client:
        registration:
          naver:
            client-name: naver
            redirect-uri: http://localhost:8081/user-service/user/oauth2/code/naver
            authorization-grant-type: authorization_code
            scope: name,email,mobile
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
          google:
            client-name: google
            redirect-uri: http://localhost:8081/user-service/user/oauth2/code/google
            authorization-grant-type: authorization_code
            scope: openid,profile,email
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

app:
  # users.email, name, phone, address Envelope Encryption KEK. 운영은 환경 변수 USER_CRYPTO_KEY
  crypto:
    key: ${USER_CRYPTO_KEY:ZGV2LW9ubHktdXNlci1rZXktbm90LWZvci1wcm9kISE=}
  frontend:
    url: http://localhost:5173
  cookie:
    secure: false
    same-site: Lax
    session-cookie-name: session
    oauth-transaction-name: oauth_tx
    oauth-transaction-max-age: 10m

auth:
  access-token-public: ${JWT_SECRET:-----BEGIN PUBLIC KEY-----MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE7wOxzOM9xtHw9RvbS19kvJeoioQxiI9vA5BfCEUAkO4bzjy+ODGws6oL7Vv6Dv0YXGdwLqmIkrn6RKujHYoH7g==-----END PUBLIC KEY-----}
  access-token-private: ${JWT_PRIVATE:-----BEGIN PRIVATE KEY-----MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQglqtT6MHs37oWHt8aA1MYWXR9K0rrTNsyVGMPPiJFGMChRANCAATvA7HM4z3G0fD1G9tLX2S8l6iKhDGIj28DkF8IRQCQ7hvOPL44MbCzqgvtW/oO/RhcZ3AuqYiSufpEq6Mdigfu-----END PRIVATE KEY-----}
