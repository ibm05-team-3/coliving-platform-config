# contract-service 개발 환경 전용
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/contract_service
    username: postgres
    password: admin
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    generate-ddl: false
    hibernate:
      ddl-auto: update
    show-sql: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer   
      acks: all
  grpc:
    client:
      channel:
        document:
          target: localhost:9087       # ⚠ HTTP 포트가 아니라 gRPC 서버 포트인지 확인

app:
  frontend:
    url: http://localhost:5173
  kakaopay:
    secret-key: ${KAKAOPAY_SECRET_KEY}
    cid: TC0ONETIME                       # 카카오페이 테스트용 가맹점 코드
    approval-url: ${app.frontend.url}/contract/pay/approve   # 서버가 ?applicationNo=..&orderId=.. 붙임
    cancel-url: ${app.frontend.url}/contract/pay?result=cancel
    fail-url: ${app.frontend.url}/contract/pay?result=fail
  portone:
    store-id: ${PORTONE_STORE_ID}
    api-secret: ${PORTONE_API_SECRET}
